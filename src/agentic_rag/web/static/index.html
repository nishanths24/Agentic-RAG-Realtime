<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agentic RAG</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <h1>Agentic RAG</h1>
        <p class="lede">Ask a question. The app retrieves local documents and calls live tools only when needed.</p>
      </div>
      <section>
        <h2>Indexed sources</h2>
        <ul id="sources" class="source-list"><li class="muted">Loading…</li></ul>
      </section>
      <section>
        <h2>Try these</h2>
        <div class="pills" id="pills"></div>
      </section>
      <div class="health" id="health">Connecting…</div>
    </aside>

    <main class="stage">
      <header class="topbar">
        <h2>Ask a question</h2>
        <button id="rebuild" class="ghost" type="button">Rebuild index</button>
      </header>

      <section id="thread" class="thread" aria-live="polite"></section>

      <form id="composer" class="composer">
        <label class="sr-only" for="question">Question</label>
        <textarea id="question" rows="2" maxlength="2000" placeholder="Ask about travel policy, Tokyo time, weather, or currency conversion…"></textarea>
        <div class="composer-row">
          <span class="hint">Answers show document evidence and live tool results separately.</span>
          <button type="submit" id="send">Ask</button>
        </div>
      </form>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
